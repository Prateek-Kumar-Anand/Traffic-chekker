name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site and inject Maps API key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir _site
          cp index.html style.css app.js config.js _site/
          if [ -n "$MAPS_KEY" ]; then
            sed -i "s|__GOOGLE_MAPS_API_KEY__|${MAPS_KEY}|g" _site/config.js
            echo "API key injected from repository secret."
          else
            echo "::warning::No GOOGLE_MAPS_API_KEY secret set. The site will ask visitors for their own key."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
