name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, nothing else. No secrets are used here:
# the site only needs the backend's public address.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # API_BASE_URL is a repository *variable* (Settings > Secrets and variables > Actions > Variables).
      # The build fails if the output contains anything that looks like a key or connection string.
      - name: Build site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
