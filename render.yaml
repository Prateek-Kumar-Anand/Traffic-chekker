# Render blueprint for the backend. Secrets are entered in the Render dashboard (sync: false),
# never committed here.
services:
  - type: web
    name: traffic-checker-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DAILY_GOOGLE_CALL_LIMIT
        value: "1000"
